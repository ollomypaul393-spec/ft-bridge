name: Release
# Publishes a GitHub release automatically whenever package.json gets a new version on main.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Create release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          if gh release view "$V" >/dev/null 2>&1; then
            echo "$V already released"
          else
            gh release create "$V" --target "$GITHUB_SHA" --title "FT Bridge $V" --generate-notes
          fi
