name: Daily report (21:20 Dar es Salaam)
# Wakes the free Render server and asks it to email the day's report.
# The server only sends once per day, only after 21:00, and only if the daily email is on in Settings.
on:
  schedule:
    - cron: '20 18 * * *'   # 18:20 UTC = 21:20 EAT (GitHub may run it a few minutes late)
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the server and send the report
        env:
          SITE: ${{ vars.SITE_URL || 'https://ft-bridge.onrender.com' }}
        run: |
          for i in 1 2 3 4 5 6; do
            out=$(curl -s --max-time 90 "$SITE/cron/daily") && echo "$out" && echo "$out" | grep -q '"ok":true' && exit 0
            echo "Server still waking up… ($i)"; sleep 20
          done
          exit 1
